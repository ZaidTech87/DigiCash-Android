# Project-wide Gradle settings.

# JVM arguments for the Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable AndroidX
android.useAndroidX=true

# Disable auto-migration of third-party legacy libraries (none used here, kept false for safety)
android.enableJetifier=false

# Use non-transitive R classes for faster, cleaner builds
android.nonTransitiveRClass=true

# Gradle configuration cache off for compatibility with Room/WorkManager annotation processors
org.gradle.configuration-cache=false

# Enable parallel project execution
org.gradle.parallel=true

# Kotlin is NOT used in this project (Java only)

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
